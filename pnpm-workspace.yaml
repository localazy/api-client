# Keep a single-document lockfile, GitHub dependency graph cannot read the pnpm 12 env document
# https://github.com/dependabot/dependabot-core/issues/15904
pmOnFail: ignore

allowBuilds:
  esbuild: true
minimumReleaseAgeExclude:
  - brace-expansion@5.0.6
  - tmp@0.2.6
  - esbuild@0.28.1
  - brace-expansion@5.0.7
  - brace-expansion@5.0.8
  - brace-expansion@5.0.9
overrides:
  '@vitest/mocker@>=5.0.0-beta.1 <5.0.3': ^5.0.3
  esbuild@>=0.27.3 <0.28.1: ^0.28.1
